<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 知白台图标 · 瓦当"知"（V2 统一蓝色定稿，与 pwa-192/512 同构） -->
  <!-- 黛蓝底 -->
  <rect width="64" height="64" rx="14" fill="#2E5A8C"/>
  <!-- 瓦当外轮 -->
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <!-- 弦纹 -->
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="#FFFFFF" stroke-width="0.9" opacity="0.6"/>
  <!-- 四向箭头纹（鎏金，贴外轮内侧） -->
  <g fill="#E3C25C">
    <path d="M30.6 5.4 L33.4 5.4 L32 10.2 Z"/>
    <path d="M30.6 58.6 L33.4 58.6 L32 53.8 Z"/>
    <path d="M5.4 30.6 L5.4 33.4 L10.2 32 Z"/>
    <path d="M58.6 30.6 L58.6 33.4 L53.8 32 Z"/>
  </g>
  <!-- 楷体白文「知」（本地无楷体时回退衬线，仍为白字可辨） -->
  <text x="32" y="32" fill="#FFFFFF" font-family="KaiTi, STKaiti, '楷体', serif"
        font-size="30" text-anchor="middle" dominant-baseline="central">知</text>
</svg>
