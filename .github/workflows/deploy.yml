# 知白台 —— GitHub Pages 自动部署
# 每次 push 到 main 后：构建 → 发布到 GitHub Pages
# 你只需：建仓库 → push → 仓库 Settings → Pages → Source 选「GitHub Actions」
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 要求 Node ≥20.19 或 ≥22.12；固定 20 会拿到旧版 20.x 导致构建瞬间失败。
          # 用 24（当前 LTS 安全线）保证与本地一致。若回归，回退为 22。
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci
        env:
          # 出现描述不清的瞬间失败时，禁用缓存与软链定位根因
          npm_config_cache: /tmp/npm-cache

      - name: Build (base = 仓库名)
        # 关键：GitHub Pages 部署在 https://<user>.github.io/<仓库名>/ 子路径
        # 用仓库名作为 base，资源路径才正确
        # 注意：不要用 `| tee` 包命令 —— 管道会吞掉非零退出码，
        # 让 tsc 编译失败被误报为成功，dist 缺失拖到上传步骤才爆。
        # 步骤日志本身在 Actions 里完整可见，无需 tee 备份。
        run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          npm_config_cache: /tmp/npm-cache

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
