name = "zhibaitai-proxy"
main = "worker.js"
compatibility_date = "2026-01-01"

# ============================================================
# 必填：主机白名单（Step 5-1 · B1）
# ============================================================
# 不配置 = 本代理**拒绝一切转发**（返回 503，并告诉你该配什么）。
# 这是刻意的：空列表如果等于"不限主机"，部署出来就是一台对全互联网开放的
# 转发跳板 —— 任何人可用它转发任意目标，流量与风险都记在你账上。
#
# 按你要抓的源填写（逗号分隔）。常用的几个：
#   api.bilibili.com  —— 用 B 站源就必须有它（B 站接口不发 CORS）
#   www.qbitai.com    —— 量子位 RSS
#   www.ithome.com    —— IT之家 RSS
#   sspai.com         —— 少数派（自带 CORS，可不经代理）
#   api.github.com    —— 情报的 GitHub 源（自带 CORS，可不经代理）
#   api.jikan.moe     —— 日漫新番（自带 CORS，可不经代理）
#
# ⚠️ 只填你真正要抓的域名。填得越少，被滥用时的损失越小。
[vars]
ALLOWED_HOSTS = "api.bilibili.com,www.qbitai.com,www.ithome.com"

# ============================================================
# 建议：来源白名单
# ============================================================
# 不配置 = 回显任意来源（Access-Control-Allow-Origin: *）。
# 在主机白名单已收窄的前提下风险有限，但仍建议填上你的应用地址，
# 免得别人的网页也能借你这台代理取数据。
#
# ALLOWED_ORIGINS = "https://<你的用户名>.github.io,http://localhost:5173"
