<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 用相对路径而非 /favicon-v2.svg：GitHub Pages 子路径（/zhibai-tai/）部署下
         绝对根路径 `/favicon-v2.svg` 会 404，导致浏览器标签页无图标 -->
    <link rel="icon" type="image/svg+xml" href="favicon-v2.svg" />
    <!-- iOS 添加主屏幕不读 manifest，只认 apple-touch-icon（缺失会退回把页面截图当图标）；
         180x180 为 iOS 规范尺寸，专用图由 scripts/generate_maskable_icon.py 生成 -->
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 状态栏 / 标题栏配色。**必须与侧栏同色**，否则深色主题下会出现"顶部没铺满"的色带。
         这里写深色值（应用默认主题）只是占位：下面的预判脚本会**在首次绘制前**按真实主题改写它，
         React 接管后由 ThemeApplier 持续同步（单一事实源见 src/app/theme.ts）。 -->
    <meta name="theme-color" content="#2e5a8c" />
    <!-- iOS：只靠 manifest 的 display:standalone，旧版安装后会带地址栏打开、不像 App；
         这三个 meta 是 iOS 的对应约定（全屏 / 主屏显示名 / 状态栏样式） -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="知白台" />
    <!-- black-translucent（**不是 default**）：default 会让 iOS 保留状态栏、内容从状态栏下方开始，
         于是 `viewport-fit=cover` 白开了，顶栏上方永远留一条空白；
         black-translucent 把内容顶到屏幕边缘，再由顶栏自己用 env(safe-area-inset-top) 让开文字。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="知白台 — 知其白，守其黑 · 个人效率系统" />
    <!-- manifest 由 vite-plugin-pwa 注入（感知 base，子路径部署可用）；
         此前手写 /manifest.webmanifest 在 GitHub Pages 子路径下 404，
         导致 PWA 安装后拿不到图标、显示浏览器生成的字母回退图 -->
    <title>知白台</title>
    <script>
      /* 启动页主题预判：底色必须在首屏绘制前定下来，否则「先按亮色画一遍、
         再被应用设置改暗」会闪一下白。主题存在 localStorage（zustand persist
         的 yishu-workbench:settings），此处同步读出即可。
         **读不到（首次访问）时取 light** —— 与 `useSettingsStore` 的品牌默认值一致
         （Step 5-3 §十九：浅色是品牌默认体验，深色是完整可用的第二主题）。 */
      ;(function () {
        var dark = true
        try {
          var raw = localStorage.getItem('yishu-workbench:settings')
          var theme = raw ? (JSON.parse(raw).state || {}).theme : 'light'
          dark =
            theme === 'dark' ||
            (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        } catch (e) {
          /* 存储读不出来（损坏 / 被清）时**回退到品牌默认 light**，而不是跟随系统偏好：
             zustand persist 那边解析失败也会回落到默认值 light —— 两边必须同一口径，
             否则会出现"启动屏黑、进去是白的"这种自相矛盾的闪动（2026-10-01 修）。 */
          dark = false
        }
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        /* 状态栏配色必须与 data-theme 同步改写：meta 里写死的那个值只适用于单一主题，
           深色主题（应用默认）下状态栏会是错色，表现为顶部一条不属于应用的色带。
           取值与 src/app/theme.ts 的 THEME_COLOR 一致（这里没法 import，故各写一份）。 */
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', dark ? '#5c1f1a' : '#2e5a8c')
      })()
      /* 记录「首帧绘制起点」：静态启动屏的进度条动画从这里开始计时（见 .boot-fill）。
         React 接管后用这个时间点给进度条补一个负的 animation-delay，使进度从静态占位
         当时的位置无缝续接，而不是新建一个元素又从 6% 重新跑一遍（慢网下会肉眼可见地回跳）。 */
      ;(function () {
        try {
          window.__bootStart = window.performance && typeof window.performance.now === 'function'
            ? window.performance.now()
            : Date.now()
        } catch (e) {
          window.__bootStart = Date.now()
        }
      })()
    </script>
    <style>
      /* 启动页样式只此一份：这段 <style> 常驻页面，React 挂载后的 BootScreen
         用同一套 class 输出同样结构，因此从静态占位切到 React 时视觉零跳变
         （不换色、不换字号、不位移），也就没有「白屏 → 内容」的闪断。 */
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* ⚠️ 与 `tokens.css` 的 `--paper` **同值**（浅色 #ffffff / 深色 #000000）——
           两者有色差，启动屏切进工作台时会看到一次整体变色。
           这里必须硬编码：静态启动屏要在 CSS 加载**之前**就画出第一帧，
           用 `var(--paper)` 会拿到未定义值 → 白屏一闪。
           2026-10-01 起**全面移除纸白 #F3EDE0**（图标底、启动屏、太极白半圆统一纯白）。 */
        background: #ffffff;
        color: #21262d;
        transition: opacity 420ms cubic-bezier(0.2, 0, 0, 1);
      }
      html[data-theme='dark'] .boot {
        background: #000000;
        color: #e6e8eb;
      }
      .boot[data-leaving='true'] {
        opacity: 0;
        pointer-events: none;
      }

      /* 太极统一为「蓝白」：浅色主题黛蓝 + **纯白**（白半圆自带极细描边，见 .bm-b）；
         深色主题改用亮阶黛蓝 + 近白，保证黑底上清晰。 */
      .boot-mark {
        width: clamp(64px, 17vw, 104px);
        height: clamp(64px, 17vw, 104px);
        --boot-a: #2e5a8c;
        /* 「白半圆」用**纯白**（2026-09-30 用户拍板，此前是纸白 #F3EDE0）。
           纯白与启动屏底色 #ffffff 同色 → 靠 `.bm-b` 的**极细黛蓝描边**立住边界
           （否则太极会只剩一个 D 形；下白点也会消失）。 */
        --boot-b: #ffffff;
        --boot-ring: #2e5a8c;
        /* 入场只做一次：淡入 + 轻微收拢。
           ⚠️ 它与旋转**必须分层在两个元素上** —— 并列写在同一元素的 animation
           列表里时，`transform` 会被后一个接管，实测连 `opacity` 也会卡在首帧
           （诊断数据：opacity=0 / transform=matrix(0.9,…) 一直不动）。 */
        animation: boot-mark-in 620ms cubic-bezier(0.2, 0, 0, 1) both;
      }
      html[data-theme='dark'] .boot-mark {
        --boot-a: #4f83bd;
        --boot-b: #f7f8fa;
        --boot-ring: #f7f8fa;
      }
      .boot-mark svg {
        width: 100%;
        height: 100%;
        /* 旋转与入场分层：本元素**只负责转**（3.6s/圈的匀速率，不做加速、不做脉冲）。
           「转」是这条品牌线的既定语言（纯白底上一枚缓缓转动的太极），不是 loading 指示器。 */
        will-change: transform;
        transform-origin: 50% 50%;
        animation: boot-spin 3.6s linear infinite;
      }
      @keyframes boot-mark-in {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: none; }
      }
      .bm-a { fill: var(--boot-a); }
      /* 纯白半圆 + 极细描边：白底上保住形状（见 --boot-b 处注释）。
         `-opacity` 而不是 `opacity`：只淡描边，不淡填充，免得整块发灰。 */
      .bm-b {
        fill: var(--boot-b);
        stroke: var(--boot-a);
        stroke-width: 0.8;
        stroke-opacity: 0.6;
      }
      .bm-ring {
        fill: none;
        stroke: var(--boot-ring);
        /* 细环是"印"感的主要来源（白半圆自身另有 0.8px 描边）—— 保持 1.8 */
        stroke-width: 1.8;
        opacity: 0.85;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }

      .boot-name {
        margin: 22px 0 0;
        /* 与 tokens.css 的 `--font-deco-stack` 同源。只写 `serif` 时，在缺中文字体的
           环境（无头浏览器、部分 Android）会渲染成**空白** —— 启动屏就只剩一行小字。 */
        font-family: 'Ma Shan Zheng', 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
        font-size: clamp(20px, 5.4vw, 27px);
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        /* 印记落定之后名字才出现（延 280ms）：顺序即叙事 —— 先看见符号，再读到名字 */
        animation: boot-rise 520ms cubic-bezier(0.2, 0, 0, 1) 280ms both;
      }
      .boot-poem {
        margin: 10px 0 0;
        font-size: clamp(11px, 3vw, 12px);
        letter-spacing: 0.22em;
        text-indent: 0.22em;
        opacity: 0.5;
        animation: boot-rise 520ms cubic-bezier(0.2, 0, 0, 1) 420ms both;
      }
      /* `to` 里**不写 opacity**：缺失属性按元素自身计算值收尾 ——
         于是 name（1）与 poem（0.5）能共用同一组关键帧，不必写两份 */
      @keyframes boot-rise {
        from { opacity: 0; transform: translateY(6px); }
        to { transform: none; }
      }

      .boot-track {
        margin-top: clamp(26px, 6vh, 40px);
        width: clamp(112px, 34vw, 176px);
        height: 2px;
        border-radius: 2px;
        background: currentColor;
        opacity: 0.14;
        overflow: hidden;
      }
      /* 进度条由**时间**驱动：本地 IndexedDB 是毫秒级就绪，若纯按「步骤完成数」走，
         用户根本看不到加载过程（反馈过的"一闪而过"）。900ms 推到 88%，最后 12%
         留给「真正就绪」那一刻补满 —— 数据快时有完整动画，数据慢时也不会先满再干等。
         推进用 transform: scaleX 而非 width：width 每帧触发布局重排（layout thrash），
         在主线程被数据加载占用时掉帧；scaleX 只动合成层，与太极一样 GPU 友好。
         占位宽度恒为轨道 100%，视觉宽度完全由 scaleX 表达。 */
      .boot-fill {
        display: block;
        height: 100%;
        width: 100%;
        border-radius: 2px;
        background: #8a6508;
        transform: scaleX(0.06);
        transform-origin: left center;
        animation: boot-progress 900ms cubic-bezier(0.2, 0, 0, 1) both;
      }
      html[data-theme='dark'] .boot-fill {
        background: #c9a227;
      }
      @keyframes boot-progress {
        from { transform: scaleX(0.06); }
        to { transform: scaleX(0.88); }
      }
      /* 就绪：立刻补满最后一段，并停掉时间动画（否则终态会盖住这个宽度） */
      .boot-fill[data-done='true'] {
        animation: none;
        transform: scaleX(1);
        transition: transform 240ms cubic-bezier(0.2, 0, 0, 1);
      }

      .boot-step {
        margin: 14px 0 0;
        font-size: 12px;
        letter-spacing: 0.14em;
        opacity: 0.55;
      }

      /* React 接管后（BootScreen）**不重播入场**：那两段已经在静态屏演过一遍，
         再演一次会看到"印记又一次淡入、名字又一次浮起"。
         ⚠️ `svg` 不在这个列表里 —— 旋转是**持续态**，要继续转。 */
      .boot[data-resumed='true'] .boot-mark,
      .boot[data-resumed='true'] .boot-name,
      .boot[data-resumed='true'] .boot-poem {
        animation: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-mark,
        .boot-mark svg,
        .boot-name,
        .boot-poem,
        .boot-fill {
          animation: none;
        }
        .boot-fill {
          transform: scaleX(0.88);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-mark">
          <!-- 阴阳鱼用一条 path 直接画：靠两个 clipPath 叠加「相减」在 SVG 里不成立
               —— clipPath 内的多个子形状取并集，不会挖洞，结果是两块色斑加一个多余的圆 -->
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle class="bm-b" cx="50" cy="50" r="46" />
            <path
              class="bm-a"
              d="M50 4 A46 46 0 0 1 50 96 A23 23 0 0 1 50 50 A23 23 0 0 0 50 4 Z"
            />
            <circle class="bm-a" cx="50" cy="27" r="8.3" />
            <circle class="bm-b" cx="50" cy="73" r="8.3" />
            <circle class="bm-ring" cx="50" cy="50" r="45.6" />
          </svg>
        </div>
        <p class="boot-name">知白台</p>
        <p class="boot-poem">知其白，守其黑</p>
        <div class="boot-track"><i class="boot-fill"></i></div>
        <p class="boot-step">正在铺开文房</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
