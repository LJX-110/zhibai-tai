<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 用相对路径而非 /favicon-v2.svg：GitHub Pages 子路径（/zhibai-tai/）部署下
         绝对根路径 `/favicon-v2.svg` 会 404，导致浏览器标签页无图标 -->
    <link rel="icon" type="image/svg+xml" href="favicon-v2.svg" />
    <!-- iOS 添加主屏幕不读 manifest，只认 apple-touch-icon（缺失会退回把页面截图当图标）；
         180x180 为 iOS 规范尺寸，专用图由 scripts/generate_maskable_icon.py 生成 -->
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2e5a8c" />
    <meta name="description" content="知白台 — 知其白，守其黑 · 个人效率系统" />
    <!-- manifest 由 vite-plugin-pwa 注入（感知 base，子路径部署可用）；
         此前手写 /manifest.webmanifest 在 GitHub Pages 子路径下 404，
         导致 PWA 安装后拿不到图标、显示浏览器生成的字母回退图 -->
    <title>知白台</title>
  </head>
  <body>
    <div id="root">
      <!-- React 挂载前的加载占位：与 BootScreen 同一太极（黛蓝+鎏金，旋转），避免浏览器默认白屏/菊花 -->
      <div style="display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#f7f5f0;color:#6b6b6b;font-size:13px">
        <svg width="72" height="72" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="animation:zbt-spin 2.2s linear infinite">
          <defs>
            <clipPath id="zbt-half"><rect x="50" y="0" width="50" height="100"/></clipPath>
            <clipPath id="zbt-quarter"><circle cx="50" cy="50" r="50"/><circle cx="75" cy="50" r="25" fill="white"/></clipPath>
          </defs>
          <circle cx="50" cy="50" r="46" fill="#2e5a8c"/>
          <circle cx="50" cy="50" r="46" fill="#8a6508" clip-path="url(#zbt-half)"/>
          <circle cx="50" cy="37" r="12" fill="#2e5a8c" clip-path="url(#zbt-quarter)"/>
          <circle cx="50" cy="63" r="12" fill="#8a6508"/>
        </svg>
        <p style="margin:0;letter-spacing:0.15em">正在铺开文房 …</p>
      </div>
      <style>@keyframes zbt-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
